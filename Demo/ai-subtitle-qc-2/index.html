        seg.voice.checked = true;
      }
      function triggerSingleRedub(segId){
        const seg = segments.find(s => s.id === segId);
        if(!seg) return;
        redubMode = 'results';
        ensureLoadingVoice(seg);
        activeSegment = seg.id;
        updateVideo(seg.id);
        renderRows(activeSegment);
        requestAnimationFrame(()=>{ const panel=rowsEl.querySelector('[data-voice-panel="'+seg.id+'"]'); if(panel) panel.scrollIntoView({block:'nearest'}); });
        setTimeout(()=>{ finishVoice(seg); renderRows(activeSegment); showToast('已生成 3 个候选配音'); }, 760);
      }
      function enterBatchRedub(){
        redubMode = 'select';
        batchSelectedIds = new Set(['s1','s2']);
        renderRows(activeSegment);
      }
      function startBatchRedub(){
        if(!batchSelectedIds.size){ showToast('请先勾选需要重新配音的段落'); return; }
        redubMode = 'running';
        const ids = Array.from(batchSelectedIds);
        ids.forEach(id => {
          const seg = segments.find(s => s.id === id);
          if(seg) ensureLoadingVoice(seg);
        });
        renderRows(activeSegment);
        setTimeout(()=>{
          ids.forEach(id => {
            const seg = segments.find(s => s.id === id);
            if(seg) finishVoice(seg);
          });
          redubMode = 'results';
          renderRows(activeSegment);
          showToast('已生成 '+ids.length+' 句配音候选');
        }, 860);
      }
      function regenerateCandidate(seg, index){
        const item = seg.voice.candidates[index];
        item.status = 'loading';
        renderRows(activeSegment);
        setTimeout(()=>{ seg.voice.candidates[index] = makeCandidate(index); seg.voice.selected = index; renderRows(activeSegment); showToast('已换出新的候选 '+(index+1)); }, 650);
      }
      function refreshCandidates(seg){
        seg.voice.candidates = seg.voice.candidates.map((_, i) => ({...makeCandidate(i), status:'loading'}));
        seg.voice.selected = 0;
        renderRows(activeSegment);
        setTimeout(()=>{ seg.voice.candidates = seg.voice.candidates.map((_, i) => makeCandidate(i)); seg.voice.selected = 0; renderRows(activeSegment); showToast('已重新生成 3 个候选'); }, 720);
      }
      function acceptVoice(seg){
        const candidate = seg.voice.candidates[seg.voice.selected];
        if(!candidate || candidate.status !== 'ready'){ showToast('当前候选不可采用'); return; }
        seg.voice = null;
        renderRows(activeSegment);
        updateVoiceBatch();
        showToast('已采用当前候选音频');
      }
      function renderRows(active){
        const canShowInsert = redubMode !== 'select';
        const topInsert = canShowInsert ? '<div class="insertArea" data-insert-after="0"><button type="button" class="insertBtn"><span>＋</span>插入</button></div>' : '';
        rowsEl.innerHTML = topInsert + segments.map((s, index) => {
          const item = qc.find(q => q.seg === s.id);
          const source = esc(s.source);
          const times = s.time.split(' - ');
          const errorBadge = item ? '<span class="errorBadge"><span class="errorIcon">!</span><span>'+esc(item.group === '原文错误' ? '原文错误' : '文本规范')+'</span></span>' : '';
          const moreMenu = '<div class="segmentMoreWrap"><button type="button" class="segmentTool segmentMoreBtn" aria-label="更多段落操作">'+antToolbarIcon('more')+'更多</button><div class="segmentMoreMenu"><button type="button" class="segmentMoreItem" data-more-action="retain-original" data-seg="'+s.id+'">保留原人声</button><button type="button" class="segmentMoreItem danger" data-more-action="delete" data-seg="'+s.id+'">删除</button></div></div>';
          const toolbar = active===s.id && redubMode!=='select' ? '<div class="segmentToolbar"><div class="segmentToolGroup"><button type="button" class="segmentTool" data-tool="重翻">'+antToolbarIcon('translation')+'重翻</button><button type="button" class="segmentTool" data-tool="情感调节">'+antToolbarIcon('smile')+'情感调节</button><button type="button" class="segmentTool" data-tool="语气词">'+antToolbarIcon('comment')+'语气词</button><button type="button" class="segmentTool" data-tool="重新生成配音">'+antToolbarIcon('audio')+'重新生成配音</button><button type="button" class="segmentTool" data-tool="发音纠正">'+antToolbarIcon('sound')+'发音纠正</button></div>'+moreMenu+'</div>' : '';
          const batchCheck = redubMode === 'select' ? '<label class="batchRowCheck"><input type="checkbox" class="batchRowInput" data-batch-row="'+s.id+'" '+(batchSelectedIds.has(s.id)?'checked':'')+'></label>' : '';
          const rowHtml = '<div class="subtitleItem '+(active===s.id?'active ':'')+(item?'hasError ':'')+(s.voice&&redubMode!=='select'?'hasVoice ':'')+(redubMode==='select'?'batchSelectable':'')+'" data-seg="'+s.id+'">'+errorBadge+toolbar+batchCheck+'<div class="speakerCell"><span class="speakerBadge '+s.cls+'">'+esc(s.speaker)+'</span></div><div class="timeCell"><span class="timeLine">'+esc(times[0]||'')+'</span><span class="timeLine">'+esc(times[1]||'')+'</span></div><div class="groupCell">'+esc(s.group)+'</div><div class="textCell sourceCell"><span class="segmentIndex">'+(index+1)+'</span><div class="sourceText">'+(source || '<span class="placeholderText">空字幕段</span>')+'</div></div><div class="textCell targetCell"><div class="targetTextWrap"><button type="button" class="targetPlayBtn targetPlayFloat" data-target-play="'+s.id+'" aria-label="播放译文片段"><svg class="targetPlayIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button><div class="targetText">'+(esc(s.target) || '<span class="placeholderText">待输入译文</span>')+'</div></div></div>'+renderVoicePanel(s)+'</div>';
          const insertHtml = canShowInsert ? '<div class="insertArea" data-insert-after="'+(index+1)+'"><button type="button" class="insertBtn"><span>＋</span>插入</button></div>' : '';
          return rowHtml + insertHtml;
        }).join('');
        updateVoiceBatch();
        renderTimeline();
      }
      function renderTypes(){
        const c=counts();
        const groupNames = c.map(x=>x[0]);
        expandedGroups = new Set([...expandedGroups].filter(group => groupNames.includes(group)));
        if(!c.some(x=>x[0]===selectedGroup)){
          selectedGroup=c[0]?.[0]||'';
          if(selectedGroup) expandedGroups.add(selectedGroup);
        }
        totalEl.textContent='共 '+qc.length+' 处';
        railEl.textContent=qc.length+'处';
        typeEl.innerHTML=c.map(([group,n])=>{
          const active=group===selectedGroup;
          const expanded=expandedGroups.has(group);
          const children=expanded?'<div class="typeChildren">'+qc.filter(i=>i.group===group).map(i=>{
            const stale=i.status==='stale'?'<span class="typeChildStatus">疑似失效</span>':'<span></span>';
            return '<button type="button" class="typeChild '+(i.id===activeIssue?'active ':'')+(i.checked?'checked':'')+'" data-jump="'+i.id+'"><span>第 '+segNo(i.seg)+' 段</span><span class="typeChildDetail">｜'+esc(i.detail)+'</span>'+stale+'<span class="typeChildCheck">✓</span></button>';
          }).join('')+'</div>':'';
          return '<div><button type="button" class="typeButton '+(active?'active':'')+'" data-group="'+esc(group)+'" aria-expanded="'+expanded+'"><span class="typeName">'+esc(group)+'</span><span class="typeCount">'+n+'</span><span class="typeArrow" data-toggle-group="'+esc(group)+'">'+(expanded?'▼':'▶')+'</span></button>'+children+'</div>';
        }).join('');
      }
      function renderQc(){ const items=qc.filter(i=>i.group===selectedGroup); const sel=qc.filter(i=>i.checked).length; root.querySelector('#batchAccept').disabled=sel===0; root.querySelector('#batchIgnore').disabled=sel===0; root.querySelector('#acceptAll').disabled=qc.length===0; listEl.innerHTML=items.length?items.map(i=>{ const d=diffPair(i.current||i.before,i.after); const stale=i.status==='stale'; return '<article class="qcCard '+(i.id===activeIssue?'active ':'')+(stale?'stale':'')+'" data-qc="'+i.id+'"><div class="qcCardHeader"><label><input type="checkbox" class="qcCheck" '+(i.checked?'checked':'')+'> <span class="qcCardTitle">'+esc(i.title)+'</span></label>'+(stale?'<span class="qcStatus">疑似失效</span>':'')+'</div><div class="qcCompare"><div><strong>当前</strong>'+d.before+'</div><div><strong>建议</strong>'+d.after+'</div><div class="qcNote">'+esc(i.note)+'</div></div><div class="qcActions"><button type="button" class="btnGhost qcIgnore">忽略</button><button type="button" class="btnPrimary qcAccept">采纳</button></div></article>'; }).join(''):'<article class="qcCard"><div class="qcNote">当前分类暂无质检提醒</div></article>'; }
      function render(){ renderRows(activeSegment); renderTypes(); renderQc(); }
      function showToast(text){ toast.textContent=text; toast.style.display='block'; setTimeout(()=>toast.style.display='none',1700); }
      function jumpToIssue(id){ const item=qc.find(q=>q.id===id); if(!item) return; selectedGroup=item.group; activeIssue=item.id; activeSegment=item.seg; updateVideo(item.seg); render(); requestAnimationFrame(()=>{ const row=rowsEl.querySelector('[data-seg="'+item.seg+'"]'); if(row) row.scrollIntoView({block:'center'}); const card=listEl.querySelector('[data-qc="'+item.id+'"]'); if(card) card.scrollIntoView({block:'nearest'}); }); }
      function remove(ids, mode){ ids.forEach(id=>{ const item=qc.find(q=>q.id===id); if(mode==='accept'&&item){ const seg=segments.find(s=>s.id===item.seg); if(seg&&(seg.source===item.before||seg.source===item.current||item.status==='stale')) seg.source=item.after; }}); qc=qc.filter(q=>!ids.includes(q.id)); if(!qc.find(q=>q.id===activeIssue)) activeIssue=qc[0]?.id||''; if(activeIssue){ const item=qc.find(q=>q.id===activeIssue); selectedGroup=item.group; activeSegment=item.seg; } render(); showToast(mode==='accept'?'已采纳质检建议':'已忽略质检提醒'); }
      function openModal(title,text,confirm,fn){ root.querySelector('#modalTitle').textContent=title; root.querySelector('#modalText').textContent=text; root.querySelector('#modalConfirm').textContent=confirm; pending=fn; modal.style.display='flex'; }
      function closeModal(){ pending=null; modal.style.display='none'; }
      root.addEventListener('pointerdown', e=>{
        beginTimelineDrag(e);
      });
      window.addEventListener('pointermove', e=>{
        updateTimelineDrag(e);
      });
      window.addEventListener('pointerup', ()=>{
        endTimelineDrag();
      });
      root.addEventListener('input', e=>{
        if(e.target.closest('#subtitleStyleMask')) syncSubtitleStyleDraftFromForm();
      });
      root.addEventListener('change', e=>{
        if(e.target.closest('#subtitleStyleMask')) syncSubtitleStyleDraftFromForm();
      });
      root.addEventListener('click', e=>{
        if(timelineDragJustEnded) return;
        if(e.target.closest('#subtitleStyleBtn')){
          openSubtitleStyleDialog();
          return;
        }
        if(e.target.closest('#subtitleStyleClose') || e.target.closest('#subtitleStyleCancel')){
          closeSubtitleStyleDialog();
          return;
        }
        if(e.target.closest('#subtitleStyleReset')){
          resetSubtitleStyleToDefault();
          return;
        }
        if(e.target.closest('#subtitleStyleApply')){
          syncSubtitleStyleDraftFromForm();
          applySubtitleStyle();
          return;
        }
        if(e.target === subtitleStyleMask){
          closeSubtitleStyleDialog();
          return;
        }
        const insertBtn=e.target.closest('[data-insert-after]');
        if(insertBtn){
          e.stopPropagation();
          insertSubtitleAt(Number(insertBtn.dataset.insertAfter));
          return;
        }
        if(e.target.closest('#timelineAddBtn')){
          timelineAddWrap.classList.toggle('open');
          return;
        }
        const timelineAdd=e.target.closest('[data-timeline-add]');
        if(timelineAdd){
          timelineAddWrap.classList.remove('open');
          if(timelineAdd.dataset.timelineAdd === 'voice') addOriginalVoiceClip();
          if(timelineAdd.dataset.timelineAdd === 'segment') addTimelineSegment();
          return;
        }
        if(e.target.closest('#timelineDeleteBtn')){
          deleteSelectedTimeline();
          return;
        }
        const timelineClip=e.target.closest('.timelineSelectable');
        if(timelineClip){
          if(timelineDragJustEnded) return;
          selectTimeline(timelineClip.dataset.timelineType, timelineClip.dataset.timelineId);
          return;
        }
        if(e.target.closest('.timelineCanvas')){
          updateTimelinePlayheadFromEvent(e);
          clearTimelineSelection();
          return;
        }
        if(!e.target.closest('.timelineAddWrap')) timelineAddWrap.classList.remove('open');
        if(e.target.closest('#episodeSelect')){
          episodeNav.classList.toggle('open');
          renderEpisodeNav();
          if(episodeNav.classList.contains('open')) scrollCurrentEpisodeTile();
          return;
        }
        if(e.target.closest('#episodePrev')){
          if(!root.querySelector('#episodePrev').disabled) attemptEpisodeSwitch(currentEpisode - 1);
          return;
        }
        if(e.target.closest('#episodeNext')){
          if(!root.querySelector('#episodeNext').disabled) attemptEpisodeSwitch(currentEpisode + 1);
          return;
        }
        const episodeTile=e.target.closest('[data-episode-no]');
        if(episodeTile){
          attemptEpisodeSwitch(Number(episodeTile.dataset.episodeNo));
          return;
        }
        if(!e.target.closest('.episodeNav')) episodeNav.classList.remove('open');
        const toggleGroup=e.target.closest('[data-toggle-group]');
        if(toggleGroup){
          e.stopPropagation();
          const groupName=toggleGroup.dataset.toggleGroup;
          if(expandedGroups.has(groupName)) expandedGroups.delete(groupName);
          else {
            expandedGroups.add(groupName);
            selectedGroup=groupName;
            const first=qc.find(i=>i.group===selectedGroup);
            if(first) activeIssue=first.id;
          }
          render();
          return;
        }
        const jump=e.target.closest('[data-jump]');
        if(jump){ jumpToIssue(jump.dataset.jump); return; }
        const group=e.target.closest('[data-group]');
        if(group){ selectedGroup=group.dataset.group; expandedGroups.add(selectedGroup); const first=qc.find(i=>i.group===selectedGroup); if(first) activeIssue=first.id; render(); return; }
        const moreAction=e.target.closest('[data-more-action]');
        if(moreAction){
          const segId = moreAction.dataset.seg;
          activeSegment = segId;
          if(moreAction.dataset.moreAction === 'retain-original'){ retainOriginalVoiceForSegment(segId); renderRows(activeSegment); return; }
          if(moreAction.dataset.moreAction === 'delete'){ selectedTimeline = { type:'segment', id:segId }; deleteSelectedTimeline(); return; }
        }
        const segmentTool=e.target.closest('.segmentTool');
        if(segmentTool){
          if(!segmentTool.dataset.tool) return;
          if(segmentTool.dataset.tool === '重新生成配音'){ triggerSingleRedub(activeSegment); return; }
          showToast(segmentTool.dataset.tool === '删除' ? '打开删除段落确认' : '打开'+segmentTool.dataset.tool);
          return;
        }
        const candidate=e.target.closest('.candidateCard');
        if(candidate){
          const seg=segments.find(s=>s.id===candidate.dataset.seg);
          const index=Number(candidate.dataset.candidate);
          if(!seg||!seg.voice) return;
          if(e.target.classList.contains('voiceAccept')){ seg.voice.selected=index; acceptVoice(seg); return; }
          if(e.target.classList.contains('voiceRegenerate')){ seg.voice.selected=index; regenerateCandidate(seg,index); return; }
          if(e.target.closest('.playButton')){ showToast('播放 '+seg.voice.candidates[index].name); return; }
          if(seg.voice.candidates[index].status==='ready'){ seg.voice.selected=index; renderRows(activeSegment); }
          return;
        }
        const voicePanel=e.target.closest('.voiceResultPanel');
        if(voicePanel){
          const seg=segments.find(s=>s.id===voicePanel.dataset.voicePanel);
          if(!seg||!seg.voice) return;
          if(e.target.classList.contains('voiceScopeCheck')){ seg.voice.checked=e.target.checked; updateVoiceBatch(); return; }
          if(e.target.classList.contains('voiceRefreshGroup')){ refreshCandidates(seg); return; }
          if(e.target.classList.contains('voiceCancelGroup')){ seg.voice=null; renderRows(activeSegment); showToast('已取消该段候选结果'); return; }
        }
        const targetPlay=e.target.closest('[data-target-play]');
        if(targetPlay){
          activeSegment=targetPlay.dataset.targetPlay;
          updateVideo(activeSegment);
          showToast('播放当前版本译文音频');
          return;
        }
        const batchRow=e.target.closest('[data-batch-row]');
        if(batchRow){
          const id=batchRow.dataset.batchRow;
          if(batchRow.checked) batchSelectedIds.add(id); else batchSelectedIds.delete(id);
          updateVoiceBatch();
          return;
        }
        if(e.target.closest('.batchRowCheck')) return;
        if(e.target.id==='voiceSelectAll'){
          if(redubMode==='select') batchSelectedIds = new Set(segments.map(s=>s.id)); else voiceRows().forEach(s=>s.voice.checked=true);
          renderRows(activeSegment);
          return;
        }
        if(e.target.id==='voiceClearAll'){
          if(redubMode==='select') batchSelectedIds.clear(); else voiceRows().forEach(s=>s.voice.checked=false);
          renderRows(activeSegment);
          return;
        }
        if(e.target.id==='voiceInvertAll'){
          const next = new Set();
          segments.forEach(s=>{ if(!batchSelectedIds.has(s.id)) next.add(s.id); });
          batchSelectedIds = next;
          renderRows(activeSegment);
          return;
        }
        if(e.target.id==='voiceBatchStart'){ startBatchRedub(); return; }
        if(e.target.id==='voiceBatchCancel'){ redubMode = voiceRows().length ? 'results' : 'none'; batchSelectedIds.clear(); renderRows(activeSegment); return; }
        if(e.target.id==='voiceBatchRefresh'){ selectedVoiceRows().forEach(s=>refreshCandidates(s)); return; }
        if(e.target.id==='voiceBatchAccept'){ const rows=selectedVoiceRows().filter(s=>s.voice.candidates[s.voice.selected]?.status==='ready'); rows.forEach(s=>s.voice=null); renderRows(activeSegment); showToast('已批量采用 '+rows.length+' 个候选音频'); return; }
        if(e.target.id==='voiceBatchExit'){ voiceRows().forEach(s=>s.voice=null); redubMode='none'; renderRows(activeSegment); showToast('已退出批量抽卡结果'); return; }
        if(e.target.id==='batchRetranslate'){ showToast('发起批量重翻'); return; }
        if(e.target.id==='batchRedub'){ enterBatchRedub(); return; }
        const row=e.target.closest('.subtitleItem');
        if(row){
          if(redubMode==='select'){
            const id=row.dataset.seg;
            if(batchSelectedIds.has(id)) batchSelectedIds.delete(id); else batchSelectedIds.add(id);
            activeSegment=id;
            updateVideo(activeSegment);
            renderRows(activeSegment);
            return;
          }
          activeSegment=row.dataset.seg; updateVideo(activeSegment); renderRows(activeSegment); return;
        }
        const card=e.target.closest('.qcCard');
        if(e.target.classList.contains('qcCheck')&&card){ const item=qc.find(q=>q.id===card.dataset.qc); if(item)item.checked=e.target.checked; renderTypes(); renderQc(); return; }
        if(e.target.classList.contains('qcAccept')&&card){ remove([card.dataset.qc],'accept'); return; }
        if(e.target.classList.contains('qcIgnore')&&card){ remove([card.dataset.qc],'ignore'); return; }
        if(card && card.dataset.qc && !e.target.closest('button')){ jumpToIssue(card.dataset.qc); return; }
        if(e.target.id==='batchAccept'){ remove(qc.filter(i=>i.checked).map(i=>i.id),'accept'); return; }
        if(e.target.id==='batchIgnore'){ const ids=qc.filter(i=>i.checked).map(i=>i.id); openModal('确认忽略','将忽略已选择的 '+ids.length+' 条质检提醒，忽略后本次不再展示。','确认忽略',()=>remove(ids,'ignore')); return; }
        if(e.target.id==='acceptAll'){ const ids=qc.map(i=>i.id); openModal('该集全部采纳','将采纳当前集全部 '+ids.length+' 条质检建议，并修改对应原字幕文本。请确认后继续。','确认采纳',()=>remove(ids,'accept')); return; }
        if(e.target.id==='collapseQc'){ container.classList.add('qcCollapsed'); return; }
        if(e.target.id==='expandQc'){ container.classList.remove('qcCollapsed'); return; }
      });
      root.querySelector('#modalCancel').addEventListener('click',closeModal); root.querySelector('#modalConfirm').addEventListener('click',()=>{ const fn=pending; closeModal(); if(fn)fn(); }); updateVideo(activeSegment); updateTimelinePlayhead(currentTimelineMs); renderEpisodeNav(); render(); renderOriginalVoiceTrack();
    })();
  </script>
</div>
