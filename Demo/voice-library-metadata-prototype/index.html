<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Drama Verse 音色库元数据编辑原型</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d0c1c;
      --header: #151329;
      --panel: #242428;
      --panel-soft: #2b2b31;
      --row: #111022;
      --row-hover: #19162e;
      --line: rgba(137, 125, 205, .14);
      --line-strong: rgba(255, 255, 255, .16);
      --text: rgba(255, 255, 255, .92);
      --text-2: rgba(225, 220, 255, .68);
      --text-3: rgba(225, 220, 255, .42);
      --brand: #8355ec;
      --brand-2: #9b73ff;
      --brand-soft: rgba(124, 90, 243, .15);
      --danger: #ff526b;
      --blue: #4f8cff;
      --cyan: #17b6c8;
      --purple: #7c5af3;
      --green: #44c979;
      --yellow: #f5c45a;
      --shadow: 0 24px 72px rgba(0, 0, 0, .58);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--page);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); font-size: 14px; }
    body.modalOpen { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .page { min-height: 100vh; display: flex; flex-direction: column; background: var(--page); }
    .header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--header);
    }
    .headerLeft, .headerActions { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .headerActions { overflow-x: auto; scrollbar-width: none; }
    .headerActions::-webkit-scrollbar { display: none; }
    .backBtn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: rgba(225, 220, 255, .58);
    }
    .backBtn:hover { color: var(--brand-2); background: rgba(124, 90, 243, .08); }
    .title { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
    .titleSuffix { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--text-2); }
    .btn {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 13px;
      border: 1px solid rgba(132, 113, 224, .26);
      border-radius: 7px;
      background: rgba(29, 26, 55, .72);
      color: rgba(232, 228, 255, .78);
      box-shadow: none;
      font-size: 14px;
      white-space: nowrap;
    }
    .btnSmall {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn:hover { border-color: rgba(155, 115, 255, .48); color: #fff; background: rgba(124, 90, 243, .13); }
    .btnPrimary {
      border-color: #8656ef;
      color: #fff;
      background: linear-gradient(135deg, #6c40e8, #9655f5);
    }
    .btnDanger { color: var(--danger); border-color: rgba(255, 75, 105, .36); background: rgba(255, 63, 93, .05); }
    .iconBtn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px;
      color: rgba(255,255,255,.66);
      background: rgba(255,255,255,.04);
    }
    .iconBtn:hover { border-color: rgba(124,90,243,.42); color: #fff; background: rgba(124,90,243,.1); }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,.12); }
    .tableWrap { flex: 1; overflow: auto; }
    table { width: 100%; min-width: 1240px; border-collapse: collapse; table-layout: fixed; }
    thead th {
      height: 44px;
      padding: 0 16px;
      color: rgba(185, 176, 236, .62);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      background: #121024;
      border-bottom: 1px solid var(--line);
    }
    tbody td {
      height: 54px;
      padding: 5px 16px;
      border-bottom: 1px solid rgba(137, 125, 205, .12);
      background: var(--page);
      color: rgba(238, 235, 255, .86);
      font-size: 13px;
      vertical-align: middle;
    }
    tbody tr:hover td { background: var(--row-hover); }
    th:nth-child(1), td:nth-child(1) { width: 190px; }
    th:nth-child(2), td:nth-child(2) { width: 80px; }
    th:nth-child(3), td:nth-child(3) { width: 260px; }
    th:nth-child(4), td:nth-child(4) { width: 260px; }
    th:nth-child(5), td:nth-child(5) { width: 170px; }
    th:nth-child(6), td:nth-child(6) { width: 280px; }
    th:nth-child(7), td:nth-child(7) { width: 110px; }
    .thWithAction { display: inline-flex; align-items: center; gap: 6px; }
    .headerIconBtn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: rgba(185, 176, 236, .62);
    }
    .headerIconBtn:hover { color: #bda4ff; background: rgba(124,90,243,.12); }
    .headerIconBtn.loading { color: #bda4ff; pointer-events: none; }
    .headerIconBtn.loading svg { animation: spin .85s linear infinite; }
    .speakerCell { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
    }
    .avatar.a1 { background: linear-gradient(135deg, #287dff, #5267ff); }
    .avatar.a2 { background: linear-gradient(135deg, #8d56ff, #6248ec); }
    .avatar.a3 { background: linear-gradient(135deg, #16aec1, #02859b); }
    .avatar.a4 { background: linear-gradient(135deg, #d850dc, #9f3be2); }
    .avatar.a5 { background: linear-gradient(135deg, #5952d9, #302f97); }
    .nameText { color: #fff; font-size: 14px; font-weight: 600; }
    .subAction { width: 18px; height: 18px; color: rgba(255,255,255,.52); }
    .profileLine { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .expandBtn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(124,90,243,.25);
      border-radius: 8px;
      background: rgba(124,90,243,.08);
      color: rgba(194,184,239,.7);
    }
    .profileText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #fff; }
    .frames {
      width: 176px;
      display: grid;
      grid-template-columns: repeat(3, 40px) 32px;
      align-items: center;
      gap: 8px;
    }
    .frame {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,226,203,.95) 0 12%, transparent 13%),
        linear-gradient(135deg, rgba(96,80,67,.95), rgba(40,38,55,.92));
    }
    .frame:after {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      bottom: 7px;
      height: 14px;
      border-radius: 8px 8px 3px 3px;
      background: rgba(236,226,212,.82);
    }
    .frame.f2 { filter: hue-rotate(22deg); }
    .frame.f3 { filter: hue-rotate(64deg) saturate(1.15); }
    .frames .iconBtn { grid-column: 4; }
    .appearanceCell { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
    .appearanceLink,
    .appearanceMore {
      height: 22px;
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: rgba(189,164,255,.92);
      font-size: 12px;
      line-height: 22px;
      white-space: nowrap;
    }
    .appearanceLink:hover,
    .appearanceMore:hover { background: rgba(124,90,243,.1); color: #fff; }
    .appearanceMore { color: rgba(255,255,255,.58); }
    .appearanceRange {
      max-width: 118px;
      overflow: hidden;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .appearancePanel { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .appearancePanelTop { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .appearanceGrid {
      width: 150px;
      max-height: 86px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px 6px;
      padding-right: 4px;
    }
    .appearanceGrid::-webkit-scrollbar { width: 4px; }
    .appearanceGrid::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(255,255,255,.18); }
    .appearanceGrid .appearanceLink { justify-content: center; padding: 0; }
    .appearanceEmpty { color: rgba(255,255,255,.42); font-size: 12px; white-space: nowrap; }
    .appearanceLoading { display: inline-flex; align-items: center; gap: 6px; color: rgba(189,164,255,.78); font-size: 12px; }
    .appearanceLoading svg { animation: spin .85s linear infinite; }
    .voiceCell {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 224px) 32px;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .voiceSelect {
      min-width: 0;
      width: 100%;
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      background: rgba(255,255,255,.035);
      color: rgba(255,255,255,.88);
    }
    .voiceSelect:hover { border-color: rgba(124,90,243,.42); background: rgba(124,90,243,.08); }
    .voiceNameInCell { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 9px;
      border: 1px solid rgba(124,90,243,.42);
      border-radius: 999px;
      color: #bda4ff;
      background: rgba(124,90,243,.16);
      font-size: 12px;
      white-space: nowrap;
    }
    .badgeDrifty { color: #ffd891; border-color: rgba(245,196,90,.42); background: rgba(245,196,90,.12); }
    .ratio { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .ratioValue { color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; }
    .bar { width: 98px; height: 6px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.16); }
    .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#7c3cff,#aa78ff); }
    .modalMask {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.48);
    }
    .modalMask.show { display: flex; }
    .voiceModal, .editModal {
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      background: #242428;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .voiceModal { width: min(930px, calc(100vw - 28px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
    .editModal { width: min(700px, calc(100vw - 28px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
    .modalHeader {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .modalTitle { margin: 0; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.92); }
    .closeBtn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,.45);
      transition: color .18s ease, background .18s ease;
    }
    .closeBtn:hover { color: rgba(255,255,255,.86); background: rgba(255,255,255,.08); }
    .closeBtn svg { width: 15px; height: 15px; }
    .modalBody { flex: 1 1 auto; min-height: 0; padding: 12px 14px; overflow: auto; }
    .filterPanel {
      padding: 8px 14px 10px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    }
    .filterHeader { height: 28px; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,.45); font-size: 12px; }
    .resetBtn { border: 0; background: transparent; color: rgba(124,90,243,.8); }
    .filterRow { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .filterRow:first-of-type { border-top: 0; }
    .filterCat { width: 42px; flex: 0 0 42px; text-align: right; font-size: 12px; color: rgba(255,255,255,.38); }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .chip {
      min-height: 22px;
      padding: 1px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      color: rgba(255,255,255,.58);
      font-size: 12px;
    }
    .chip:hover { color: rgba(255,255,255,.78); background: rgba(255,255,255,.09); }
    .chip.active {
      border-color: rgba(124,90,243,.45);
      color: #bda4ff;
      background: rgba(124,90,243,.18);
      box-shadow: 0 0 12px rgba(124,90,243,.13);
    }
    .searchInput, .selectLike, .formInput, .formSelect, .textarea {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.9);
      outline: none;
    }
    .searchInput { width: 270px; height: 26px; padding: 0 10px; font-size: 12px; }
    .searchInput::placeholder, .textarea::placeholder { color: rgba(255,255,255,.3); font-size: 12px; }
    .selectLike { min-width: 210px; height: 26px; display: inline-flex; align-items: center; justify-content: space-between; padding: 0 10px; color: rgba(255,255,255,.45); font-size: 12px; }
    .voiceList { display: flex; flex-direction: column; gap: 8px; overflow: visible; padding: 2px; }
    .voiceItem {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
    }
    .voiceItem:hover { border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.06); }
    .voiceItem.selected {
      border-color: rgba(124,90,243,.42);
      background: linear-gradient(135deg, rgba(124,90,243,.12), rgba(124,90,243,.05));
      box-shadow: 0 4px 20px rgba(124,90,243,.08);
    }
    .voiceItem.currentPinned {
      position: sticky;
      top: -2px;
      z-index: 2;
      border-color: rgba(124,90,243,.3);
      background: #2a2933;
      box-shadow: 0 8px 18px rgba(0,0,0,.22);
    }
    .voiceItem.currentPinned::after {
      content: '';
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -5px;
      height: 1px;
      background: rgba(255,255,255,.1);
    }
    .selectBar { width: 3px; height: 26px; flex: 0 0 3px; border-radius: 2px; background: rgba(255,255,255,.08); }
    .voiceItem.selected .selectBar { background: linear-gradient(180deg,#b49aff,#7c5af3); box-shadow: 0 0 10px rgba(124,90,243,.5); }
    .voiceInfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .voiceTitleRow { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .voiceTitle { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.92); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .noteIcon {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
      color: rgba(245,196,90,.72);
      opacity: .82;
    }
    .noteTip { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .noteIcon:hover { color: #f5c45a; opacity: 1; }
    .meta { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; color: rgba(255,255,255,.56); font-size: 12px; white-space: nowrap; }
    .genderDot { width: 6px; height: 6px; border-radius: 50%; background: #5ea6ff; flex: 0 0 6px; }
    .genderDot.female { background: #ff82b8; }
    .genderDot.neutral { background: #b49aff; }
    .metaTags { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .currentBadge { color: #bda4ff; border-color: rgba(124,90,243,.42); background: rgba(124,90,243,.16); }
    .modalFooter {
      min-height: 56px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,.12);
      background: rgba(20,20,22,.82);
    }
    .footerLeft { min-width: 0; color: #bda4ff; font-size: 13px; display: flex; align-items: center; gap: 7px; }
    .pager { display: inline-flex; align-items: center; gap: 8px; }
    .pageNo { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; border: 1px solid rgba(124,90,243,.65); color: #bda4ff; background: rgba(124,90,243,.15); }
    .formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .formField { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .formField.full { grid-column: 1 / -1; }
    .formLabel { color: rgba(255,255,255,.68); font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .required { color: #ff6577; }
    .readonly {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 7px;
      background: rgba(255,255,255,.025);
      color: rgba(255,255,255,.56);
      cursor: default;
      user-select: text;
    }
    .readonly.warn { color: #ffd891; border-color: rgba(245,196,90,.24); background: rgba(245,196,90,.08); }
    .multiSelect {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 34px;
      position: relative;
      padding: 4px 30px 4px 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }
    .multiSelect:hover { border-color: rgba(124,90,243,.34); background: rgba(255,255,255,.055); }
    .multiSelect.open { border-color: rgba(124,90,243,.68); box-shadow: 0 0 0 2px rgba(124,90,243,.16); }
    .selectedTags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .selectedTag {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 7px;
      border-radius: 6px;
      border: 1px solid rgba(124,90,243,.38);
      background: rgba(124,90,243,.18);
      color: #d1c4ff;
      font-size: 12px;
    }
    .tagRemove {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: transparent;
      color: rgba(255,255,255,.58);
      font-size: 13px;
      line-height: 1;
    }
    .tagRemove:hover { color: #fff; background: rgba(255,255,255,.12); }
    .languageTrigger {
      flex: 1 1 92px;
      min-width: 92px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      text-align: left;
      outline: none;
    }
    .multiSelect.hasValue .languageTrigger { display: none; }
    .languageChevron {
      position: absolute;
      right: 9px;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translateY(-50%);
      color: rgba(255,255,255,.46);
      pointer-events: none;
    }
    .multiSelect.open .languageChevron { color: #bda4ff; transform: translateY(-50%) rotate(180deg); }
    .languageDropdown {
      position: absolute;
      left: -1px;
      right: -1px;
      top: calc(100% + 4px);
      z-index: 80;
      display: none;
      max-height: 216px;
      overflow: auto;
      padding: 4px;
      border: 1px solid rgba(124,90,243,.42);
      border-radius: 7px;
      background: #232328;
      box-shadow: 0 14px 34px rgba(0,0,0,.46);
    }
    .multiSelect.open .languageDropdown { display: block; }
    .languageOption {
      width: 100%;
      height: 30px;
      display: flex;
      align-items: center;
      padding: 0 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: rgba(255,255,255,.76);
      font-size: 12px;
      text-align: left;
    }
    .languageOption:hover { color: #fff; background: rgba(124,90,243,.18); }
    .languageEmpty {

    }
    function syncIcons() {
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    function stageLabel(stage) {
      return { proofread: '字幕提取', translate: '翻译', dubbing: '配音' }[stage] || '当前阶段';
    }
    function getChapterNo(chapter) {
      return Number(chapter.sequenceNo || chapter.chapterId || 0);
    }
    function formatAppearanceRange(range) {
      return range.start === range.end ? `第${range.start}集` : `第${range.start}-${range.end}集`;
    }
    function buildAppearanceRanges(chapters) {
      const ordered = [...chapters].sort((a, b) => getChapterNo(a) - getChapterNo(b));
      return ordered.reduce((ranges, chapter) => {
        const no = getChapterNo(chapter);
        const last = ranges[ranges.length - 1];
        if (last && no === last.end + 1) {
          last.end = no;
          return ranges;
        }
        ranges.push({ start: no, end: no });
        return ranges;
      }, []);
    }
    function summarizeAppearances(chapters) {
      const ranges = buildAppearanceRanges(chapters);
      const primary = ranges.slice(0, 2).map(formatAppearanceRange).join('、');
      const suffix = ranges.length > 2 ? '等' : '';
      return `${primary}${suffix} · 共${chapters.length}集`;
    }
    function renderAppearanceButton(speaker, chapter, compact = false) {
      const text = compact ? getChapterNo(chapter) : `第${getChapterNo(chapter)}集`;
      return `
        <button
          class="appearanceLink"
          type="button"
          data-appearance-speaker="${speaker.id}"
          data-appearance-chapter="${chapter.chapterId}"
          data-tooltip="点击进入${stageLabel(chapter.stage)}编辑器，并定位到该说话人的第一句台词"
        >${text}</button>
      `;
    }
    function renderAppearanceCell(speaker) {
      if (appearanceRefreshing) {
        return '<div class="appearanceLoading"><i data-lucide="loader-2"></i>检测中...</div>';
      }
      const chapters = speaker.appearanceChapters || [];
      if (!chapters.length) {
        return '<span class="appearanceEmpty" data-tooltip="当前任务内暂无出场集数">暂无出场集数</span>';
      }
      const expanded = expandedAppearanceSpeakerIds.has(speaker.id);
      if (chapters.length > 12) {
        const summary = summarizeAppearances(chapters);
        if (!expanded) {
          return `
            <div class="appearanceCell">
              <span class="appearanceRange" data-tooltip="${summary}">${summary}</span>
              <button class="appearanceMore" type="button" data-appearance-more="${speaker.id}">查看</button>
            </div>
          `;
        }
        return `
          <div class="appearancePanel">
            <div class="appearancePanelTop">
              <span class="appearanceRange" data-tooltip="${summary}">${summary}</span>
              <button class="appearanceMore" type="button" data-appearance-more="${speaker.id}">收起</button>
            </div>
            <div class="appearanceGrid">
              ${chapters.map(chapter => renderAppearanceButton(speaker, chapter, true)).join('')}
            </div>
          </div>
        `;
      }
      const visible = expanded ? chapters : chapters.slice(0, 3);
      const chapterButtons = visible.map(chapter => renderAppearanceButton(speaker, chapter)).join('');
      const rest = chapters.length - visible.length;
      const more = rest > 0
        ? `<button class="appearanceMore" type="button" data-appearance-more="${speaker.id}">+${rest}集</button>`
        : expanded && chapters.length > 3
          ? `<button class="appearanceMore" type="button" data-appearance-more="${speaker.id}">收起</button>`
          : '';
      return `<div class="appearanceCell">${chapterButtons}${more}</div>`;
    }
    function renderSpeakers() {
      $('#speakerRows').innerHTML = speakers.map((s, index) => {
        const voice = voices.find(v => v.id === s.voiceId);
        const frameHtml = Array.from({ length: s.frames }, (_, i) => `<span class="frame f${(i % 3) + 1}"></span>`).join('');
        return `
          <tr>
            <td><div class="speakerCell"><span class="avatar a${index + 1}">${index + 1}</span><span class="nameText">${s.name}</span><i class="subAction" data-lucide="pencil"></i></div></td>
            <td>${s.volume}</td>
            <td><div class="profileLine"><button class="expandBtn" type="button" aria-label="展开画像"><i data-lucide="chevron-right"></i></button><span class="profileText">${s.profile}</span></div></td>
            <td><div class="frames">${frameHtml}<button class="iconBtn" type="button" aria-label="试听原声"><i data-lucide="volume-2"></i></button></div></td>
            <td>${renderAppearanceCell(s)}</td>
            <td><div class="voiceCell"><button class="voiceSelect" type="button" data-open-voice="${s.voiceId}"><i data-lucide="volume-2"></i><span class="voiceNameInCell">${voice?.name || '选择音色'}</span></button><button class="iconBtn" type="button" aria-label="试听音色"><i data-lucide="play"></i></button></div></td>
            <td><div class="ratio"><span class="ratioValue">${s.ratio.toFixed(2)}%</span><span class="bar"><span style="width:${s.ratio}%"></span></span></div></td>
          </tr>
        `;
      }).join('');
      syncIcons();
    }
    function renderFilterRow(key, list) {
      const wrap = document.querySelector(`[data-filter="${key}"] .chips`);
      wrap.innerHTML = `<button class="chip ${filters[key] === '' ? 'active' : ''}" type="button" data-filter-chip="${key}" data-value="">全部</button>` +
        list.map(item => `<button class="chip ${filters[key] === item[0] ? 'active' : ''}" type="button" data-filter-chip="${key}" data-value="${item[0]}">${item[1]}</button>`).join('');
    }
    function renderFilters() {
      renderFilterRow('gender', options.gender);
      renderFilterRow('age', options.age);
      renderFilterRow('scene', options.scenes);
      const filterStyles = [...new Set([filters.style, ...options.styles.slice(0, FILTER_STYLE_COUNT)].filter(Boolean))];
      renderFilterRow('style', filterStyles.map(item => [item, item]));
      renderFilterRow('source', options.source);
      renderFilterRow('stability', options.stability);
      renderFilterRow('provider', options.provider);
    }
    function filteredVoices() {
      const keyword = $('#searchVoice').value.trim().toLowerCase();
      return voices.filter(v => {
        if (keyword && !v.name.toLowerCase().includes(keyword)) return false;
        if (filters.gender && v.gender !== filters.gender) return false;
        if (filters.age && v.age !== filters.age) return false;
        if (filters.scene && !v.scenes.includes(filters.scene)) return false;
        if (filters.style && !v.styles.includes(filters.style)) return false;
        if (filters.source && v.source !== filters.source) return false;
        if (filters.stability && v.stability !== filters.stability) return false;
        if (filters.provider && v.provider !== filters.provider) return false;
        return true;
      });
    }
    function renderVoices() {
      const list = filteredVoices();
      const currentVoice = voices.find(v => v.id === currentVoiceId);
      const remaining = currentVoice ? list.filter(v => v.id !== currentVoice.id) : list;
      const orderedList = currentVoice ? [currentVoice, ...remaining] : remaining;
      $('#voiceList').innerHTML = orderedList.map(v => {
        const sourceText = v.source === 'high_quality' ? '-' : label(dict.source, v.source);
        const sourceWarn = v.source === 'high_quality' ? '历史来源为“高音质”，本期不再展示为有效来源' : '';
        const isCurrent = v.id === currentVoiceId;
        return `
          <div class="voiceItem ${selectedVoiceId === v.id ? 'selected' : ''} ${isCurrent ? 'currentPinned' : ''}" data-select-voice="${v.id}">
            <span class="selectBar"></span>
            <div class="voiceInfo">
              <div class="voiceTitleRow">
                <span class="voiceTitle">${v.name}</span>
                ${v.remark ? `<span class="noteTip" data-tooltip="此处为自定义备注内容示意"><i class="noteIcon" data-lucide="message-square"></i></span>` : ''}
              </div>
              <div class="meta">
                <span class="genderDot ${v.gender}"></span>
                <span>${label(dict.gender, v.gender)}</span><span>·</span>
                <span>${label(dict.age, v.age)}</span><span>·</span>
                <span>${v.languages.map(langLabel).join('、')}</span><span>·</span>
                <span data-tooltip="${sourceWarn}">${sourceText}</span><span>·</span>
                <span>${v.provider}</span><span>·</span>
                <span>${label(dict.stability, v.stability)}</span><span>·</span>
                <span class="metaTags">${v.scenes.map(x => (options.scenes.find(s => s[0] === x) || [x,x])[1]).join(' ')} · ${v.styles.join(' ')}</span>
              </div>
            </div>
            ${isCurrent ? '<span class="badge currentBadge">当前</span>' : ''}
            <button class="iconBtn" type="button" data-edit-voice="${v.id}" aria-label="编辑音色信息" data-tooltip="点击编辑音色信息"><i data-lucide="pencil"></i></button>
            <button class="iconBtn" type="button" data-play-voice="${v.id}" aria-label="试听音色"><i data-lucide="play"></i></button>
          </div>
        `;
      }).join('') || '<div class="hint" style="padding:28px;text-align:center;">暂无符合筛选条件的音色</div>';
      const voice = voices.find(v => v.id === selectedVoiceId);
      $('#selectedHint').innerHTML = `<i data-lucide="check-circle"></i>${voice ? voice.name : '请从列表中选择一个音色'}`;
      syncIcons();
    }
    function openVoiceModal(voiceId) {
      currentVoiceId = Number(voiceId) || selectedVoiceId;
      selectedVoiceId = currentVoiceId;
      $('#voiceMask').classList.add('show');
      $('#voiceMask').setAttribute('aria-hidden', 'false');
      syncModalScrollLock();
      renderFilters();
      renderVoices();
    }
    function closeVoiceModal() {
      $('#voiceMask').classList.remove('show');
      $('#voiceMask').setAttribute('aria-hidden', 'true');
      syncModalScrollLock();
    }
    function syncModalScrollLock() {
      const hasOpenModal = $('#voiceMask').classList.contains('show') || $('#editMask').classList.contains('show');
      document.body.classList.toggle('modalOpen', hasOpenModal);
    }
    function editVoice() {
      return editDraft;
    }
    function renderOptionGroup(id, values, selected, mode, onClickName, invalidValue) {
      const active = Array.isArray(selected) ? selected : [selected];
      document.getElementById(id).innerHTML = values.map(item => {
        const isActive = active.includes(item[0]);
        const invalid = invalidValue && item[0] === invalidValue;
        return `<button class="option ${isActive ? 'active' : ''} ${invalid ? 'invalid' : ''}" type="button" data-${onClickName}="${item[0]}" data-mode="${mode}">${item[1]}</button>`;
      }).join('');
    }
    function renderStyleOptions() {
      const v = editVoice();
      const allStyles = [...new Set([...options.styles, ...v.styles])];
      const visibleStyles = styleExpanded
        ? allStyles
        : [...new Set([...v.styles, ...allStyles.slice(0, STYLE_COLLAPSED_COUNT)])];
      $('#editStyles').classList.toggle('expanded', styleExpanded);
      $('#editStyles').innerHTML = visibleStyles.map(item => {
        const isActive = v.styles.includes(item);
        return `<button class="option ${isActive ? 'active' : ''}" type="button" data-edit-style="${item}" data-mode="multi">${item}</button>`;
      }).join('');
      $('#styleCount').textContent = `已选 ${v.styles.length}/8 · 标签池 ${allStyles.length}`;
      $('#toggleStyles').textContent = styleExpanded ? '收起' : `展开全部`;
      $('#toggleStyles').style.display = allStyles.length > STYLE_COLLAPSED_COUNT ? 'inline-flex' : 'none';
      $('#styleActions').style.display = styleComposerOpen ? 'none' : 'flex';
      $('#styleComposer').classList.toggle('open', styleComposerOpen);
    }
    function renderLanguageSelect() {
      const v = editVoice();
      const selected = new Set(v.languages);
      const box = $('#languageMultiSelect');
      box.classList.toggle('hasValue', v.languages.length > 0);
      $('#editLanguageTags').innerHTML = v.languages.map(code => `
        <span class="selectedTag">${langLabel(code)}<button class="tagRemove" type="button" data-remove-language="${code}" aria-label="移除${langLabel(code)}">×</button></span>
      `).join('');
      const available = options.languages.filter(item => !selected.has(item[0]));
      $('#languageTrigger').textContent = v.languages.length ? '' : '添加语言';
      $('#languageDropdown').innerHTML = available.length
        ? available.map(item => `<button class="languageOption" type="button" data-add-language="${item[0]}">${item[1]}</button>`).join('')
        : '<div class="languageEmpty">暂无可添加语言</div>';
    }
    function openEditModal(id) {
      editingVoiceId = Number(id);
      const source = voices.find(v => v.id === editingVoiceId);
      if (!source) return;
      editDraft = JSON.parse(JSON.stringify(source));
      styleExpanded = false;
      styleComposerOpen = false;
      const v = editVoice();
      $('#editName').textContent = v.name;
      $('#editProvider').textContent = v.provider;
      $('#editRemark').value = v.remark || '';
      $('#remarkCount').textContent = String($('#editRemark').value.length);
      renderEditForm();
      $('#editMask').classList.add('show');
      $('#editMask').setAttribute('aria-hidden', 'false');
      syncModalScrollLock();
      syncIcons();
    }
    function closeEditModal() {
      $('#editMask').classList.remove('show');
      $('#editMask').setAttribute('aria-hidden', 'true');
      syncModalScrollLock();
      clearErrors();
      editingVoiceId = null;
      editDraft = null;
    }
    function renderEditForm() {
      const v = editVoice();
      if (!v) return;
      renderOptionGroup('editGender', options.gender, v.gender, 'single', 'edit-gender');
      renderOptionGroup('editAge', options.age, v.age, 'single', 'edit-age');
      renderLanguageSelect();
      const allowedAccents = v.languages.flatMap(lang => options.accentsByLanguage[lang] || []);
      const seen = new Set();
      const accents = allowedAccents.filter(item => seen.has(item[0]) ? false : (seen.add(item[0]), true));
      v.accents = v.accents.filter(accent => accents.some(item => item[0] === accent)).slice(0, 1);
      renderOptionGroup('editAccents', accents, v.accents, 'single', 'edit-accent');
      renderOptionGroup('editScenes', options.scenes, v.scenes, 'multi', 'edit-scene');
      renderStyleOptions();
      renderOptionGroup('editSource', options.source, v.source === 'high_quality' ? '' : v.source, 'single', 'edit-source');
      if (v.source === 'high_quality') {
        $('#editSource').insertAdjacentHTML('beforeend', '<span class="readonly warn">历史值：高音质，保存前需重新选择</span>');
      }
      renderOptionGroup('editStability', options.stability, v.stability || 'normal', 'single', 'edit-stability');
      syncIcons();
    }
    function clearErrors() {
      $$('[data-error]').forEach(el => el.textContent = '');
    }
    function setError(key, text) {
      const el = document.querySelector(`[data-error="${key}"]`);
      if (el) el.textContent = text;
    }
    function validateEdit() {
      clearErrors();
      const v = editVoice();
      let ok = true;
      if (!v.gender) { setError('gender', '请选择性别'); ok = false; }
      if (!v.age) { setError('age', '请选择年龄'); ok = false; }
      if (!v.languages.length) { setError('languages', '语言至少选择 1 个'); ok = false; }
      if (v.scenes.length > 5) { setError('scenes', '场景最多选择 5 个'); ok = false; }
      if (!v.styles.length) { setError('styles', '风格至少选择 1 个'); ok = false; }
      if (v.styles.length > 8) { setError('styles', '风格最多选择 8 个'); ok = false; }
      if (!v.source || v.source === 'high_quality') { setError('source', '请选择有效音色来源'); ok = false; }
      if (!v.stability) { setError('stability', '请选择音色质量'); ok = false; }
      return ok;
    }
    function saveEdit() {
      const v = editVoice();
      if (!v) return;
      v.remark = $('#editRemark').value.trim();
      if (!validateEdit()) return;
      $('#savingMask').classList.add('show');
      setTimeout(() => {
        const index = voices.findIndex(item => item.id === editingVoiceId);
        if (index >= 0) voices[index] = { ...voices[index], ...v };
        $('#savingMask').classList.remove('show');
        closeEditModal();
        renderVoices();
        renderSpeakers();
        showToast('音色信息已更新');
      }, 650);
    }
    document.addEventListener('click', (e) => {
      const openBtn = e.target.closest('[data-open-voice]');
      if (openBtn) { openVoiceModal(openBtn.dataset.openVoice); return; }
      if (e.target.closest('[data-close-voice]')) { closeVoiceModal(); return; }
      if (e.target.closest('[data-close-edit]')) { closeEditModal(); return; }
      const filterChip = e.target.closest('[data-filter-chip]');
      if (filterChip) {
        filters[filterChip.dataset.filterChip] = filterChip.dataset.value;
        renderFilters();
        renderVoices();
        return;
      }
      const selected = e.target.closest('[data-select-voice]');
      if (selected && !e.target.closest('[data-edit-voice], [data-play-voice]')) {
        selectedVoiceId = Number(selected.dataset.selectVoice);
        renderVoices();
        return;
      }
      const edit = e.target.closest('[data-edit-voice]');
      if (edit) { openEditModal(edit.dataset.editVoice); return; }
      const play = e.target.closest('[data-play-voice]');
      if (play) { showToast('正在试听音色'); return; }
      if (e.target.id === 'resetFilters') {
        Object.keys(filters).forEach(key => filters[key] = '');
        $('#searchVoice').value = '';
        renderFilters();
        renderVoices();
        return;
      }
      if (e.target.id === 'applyVoice') {
        closeVoiceModal();
        speakers[0].voiceId = selectedVoiceId;
        renderSpeakers();
        showToast('音色已应用，已读取最新音色信息');
        return;
      }
      const refreshAppearances = e.target.closest('#refreshAppearances');
      if (refreshAppearances && !appearanceRefreshing) {
        appearanceRefreshing = true;
        refreshAppearances.classList.add('loading');
        renderSpeakers();
        showToast('正在重新检测出场集数...');
        setTimeout(() => {
          speakers.forEach((speaker) => {
            speaker.appearanceChapters = (speaker.appearanceChapters || []).filter(chapter => !chapter.stale);
          });
          appearanceRefreshing = false;
          refreshAppearances.classList.remove('loading');
          renderSpeakers();
          showToast('出场集数已刷新');
        }, 900);
        return;
      }
      const appearanceMore = e.target.closest('[data-appearance-more]');
      if (appearanceMore) {
        const speakerId = Number(appearanceMore.dataset.appearanceMore);
        if (expandedAppearanceSpeakerIds.has(speakerId)) expandedAppearanceSpeakerIds.delete(speakerId);
        else expandedAppearanceSpeakerIds.add(speakerId);
        renderSpeakers();
        return;
      }
      const appearanceChapter = e.target.closest('[data-appearance-chapter]');
      if (appearanceChapter) {
        const speakerId = Number(appearanceChapter.dataset.appearanceSpeaker);
        const chapterId = Number(appearanceChapter.dataset.appearanceChapter);
        const speaker = speakers.find(item => item.id === speakerId);
        const chapter = speaker?.appearanceChapters?.find(item => item.chapterId === chapterId);
        if (!speaker || !chapter) {
          showToast('该说话人在当前任务内暂无出场集数');
          return;
        }
        if (chapter.stale) {
          speaker.appearanceChapters = speaker.appearanceChapters.filter(item => !item.stale);
          renderSpeakers();
          showToast('该说话人在当前集暂无出场，出场集数已刷新');
          return;
        }
        showToast(`已进入${stageLabel(chapter.stage)}编辑器，并定位到${speaker.name}第一句台词`);
        return;
      }
      const v = editVoice();
      if (!v) return;
      if (!e.target.closest('#languageMultiSelect')) {
        $('#languageMultiSelect')?.classList.remove('open');
      }
      const addLanguage = e.target.closest('[data-add-language]');
      if (addLanguage) {
        if (!v.languages.includes(addLanguage.dataset.addLanguage)) v.languages.push(addLanguage.dataset.addLanguage);
        renderEditForm();
        validateEdit();
        $('#languageMultiSelect').classList.add('open');
        return;
      }
      const removeLanguage = e.target.closest('[data-remove-language]');
      if (removeLanguage) {
        v.languages = v.languages.filter(item => item !== removeLanguage.dataset.removeLanguage);
        const allowed = new Set(v.languages.flatMap(lang => (options.accentsByLanguage[lang] || []).map(item => item[0])));
        v.accents = v.accents.filter(item => allowed.has(item)).slice(0, 1);
        renderEditForm();
        validateEdit();
        return;
      }
      if (e.target.closest('#languageMultiSelect')) {
        $('#languageMultiSelect').classList.toggle('open');
        return;
      }
      if (e.target.id === 'toggleStyles') {
        styleExpanded = !styleExpanded;
        renderEditForm();
        return;
      }
      if (e.target.id === 'showStyleInput') {
        styleComposerOpen = true;
        renderEditForm();
        $('#customStyle')?.focus();
        return;
      }
      if (e.target.id === 'cancelStyleInput') {
        styleComposerOpen = false;
        $('#customStyle').value = '';
        setError('styles', '');
        renderEditForm();
        return;
      }
      const mappings = [
        ['edit-gender', 'gender', 'single'],
        ['edit-age', 'age', 'single'],
        ['edit-accent', 'accents', 'single-array'],
        ['edit-scene', 'scenes', 'multi'],
        ['edit-style', 'styles', 'multi'],
        ['edit-source', 'source', 'single'],
        ['edit-stability', 'stability', 'single']
      ];
      for (const [attr, field, mode] of mappings) {
        const btn = e.target.closest(`[data-${attr}]`);
        if (!btn) continue;
        const value = btn.getAttribute(`data-${attr}`);
        if (mode === 'single') v[field] = value;
        else if (mode === 'single-array') v[field] = v[field].includes(value) ? [] : [value];
        else {
          const set = new Set(v[field]);
          if (set.has(value)) set.delete(value); else set.add(value);
          v[field] = Array.from(set);
        }
        renderEditForm();
        validateEdit();
        return;
      }
      if (e.target.id === 'addStyleConfirm') {
        const input = $('#customStyle');
        const value = input.value.trim();
        if (value.length < 2 || value.length > 8) { setError('styles', '自定义风格标签需为 2-8 个字符'); return; }
        if (v.styles.includes(value)) { setError('styles', '该风格标签已存在'); return; }
        if (v.styles.length >= 8) { setError('styles', '风格最多选择 8 个'); return; }
        if (!options.styles.includes(value)) options.styles.push(value);
        v.styles.push(value);
        input.value = '';
        styleComposerOpen = false;
        renderEditForm();
        validateEdit();
        return;
      }
      if (e.target.id === 'saveVoice') saveEdit();
    });
    $('#searchVoice').addEventListener('input', renderVoices);
    $('#editRemark').addEventListener('input', (e) => {
      $('#remarkCount').textContent = String(e.target.value.length);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if ($('#editMask').classList.contains('show')) closeEditModal();
      else if ($('#voiceMask').classList.contains('show')) closeVoiceModal();
    });
    renderSpeakers();
    renderFilters();
    syncIcons();
  </script>
</body>
</html>
